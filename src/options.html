<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon48.png" width="32" height="32" alt="" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <section id="status"></section>

      <section>
        <h2 data-i18n="optionsSectionCheck"></h2>
        <div class="field">
          <label class="label" for="mailHost" data-i18n="optionsMailHost"></label>
          <select id="mailHost"></select>
          <p class="hint" data-i18n="optionsMailHostHint"></p>
        </div>
        <div class="field">
          <label class="label" for="interval" data-i18n="menuInterval"></label>
          <select id="interval"></select>
        </div>
        <label class="check"><input type="checkbox" id="pauseWhenIdle" /> <span data-i18n="optionsPauseWhenIdle"></span></label>
        <p class="hint" data-i18n="optionsPauseWhenIdleHint"></p>
      </section>

      <section>
        <h2 data-i18n="optionsSectionOpen"></h2>
        <div class="choices" role="radiogroup">
          <label class="choice">
            <input type="radio" name="openIn" value="tab" />
            <svg width="56" height="40" viewBox="0 0 56 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="8" width="52" height="30" rx="3" />
              <path d="M2 14h52M6 8V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3" />
              <path d="M18 22h20l-10 7z" stroke-linejoin="round" />
            </svg>
            <span data-i18n="optionsOpenTab"></span>
          </label>
          <label class="choice">
            <input type="radio" name="openIn" value="window" />
            <svg width="56" height="40" viewBox="0 0 56 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="6" width="34" height="24" rx="3" opacity="0.4" />
              <rect x="18" y="12" width="36" height="26" rx="3" fill="var(--card)" />
              <path d="M18 18h36M26 25h20l-10 7z" stroke-linejoin="round" />
            </svg>
            <span data-i18n="optionsOpenWindow"></span>
          </label>
        </div>
        <p class="hint" data-i18n="optionsOpenHint"></p>
        <div class="field">
          <span data-i18n="optionsShortcut"></span> <kbd id="shortcut"></kbd>
          <p class="hint" data-i18n="optionsShortcutHint"></p>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionIcon"></h2>
        <div class="field">
          <span class="label" data-i18n="menuBadge"></span>
          <div class="choices" role="radiogroup" id="badgeModes"></div>
        </div>
        <div class="field">
          <span class="label" data-i18n="optionsIconStyle"></span>
          <div class="choices icons" role="radiogroup" id="iconStyles"></div>
        </div>
        <div class="field">
          <span class="label" data-i18n="optionsBadgeColor"></span>
          <div class="colors">
            <div class="preview" aria-hidden="true"><img id="previewIcon" alt="" /><span id="previewBadge">3</span></div>
            <div>
              <div class="palette" id="backgroundPalette"><span data-i18n="optionsBadgeBackground"></span></div>
              <div class="palette" id="textPalette"><span data-i18n="optionsBadgeText"></span></div>
              <button type="button" class="link" id="resetColors" data-i18n="optionsResetColors"></button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="menuNotifications"></h2>
        <label class="check"><input type="checkbox" id="notificationsEnabled" /> <span data-i18n="menuShowNotifications"></span></label>
        <label class="check" id="soundRow"><input type="checkbox" id="soundEnabled" /> <span data-i18n="menuSound"></span></label>
        <label class="check"><input type="checkbox" id="quietHoursEnabled" /> <span data-i18n="optionsQuietHours"></span></label>
        <div class="sub" id="quietTimes">
          <span data-i18n="optionsFrom"></span> <input type="time" id="quietFrom" required />
          <span data-i18n="optionsTo"></span> <input type="time" id="quietTo" required />
        </div>
      </section>

      <section id="accounts" hidden>
        <h2 data-i18n="optionsAccounts"></h2>
        <p class="hint" data-i18n="optionsAccountsHint"></p>
        <div id="accountList"></div>
      </section>

      <footer>
        <span id="version"></span>
        <a id="rate" target="_blank" rel="noopener">★ <span data-i18n="optionsRate"></span></a>
        <a id="report" target="_blank" rel="noopener" data-i18n="optionsReportBug"></a>
      </footer>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
