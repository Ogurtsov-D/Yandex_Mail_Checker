<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle"></title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1f1f1f;
        --muted: #5f6368;
        --bg: #f6f7f9;
        --card: #fff;
        --line: #e3e5e8;
        --accent: #1a73e8;
        --accent-soft: #e8f0fe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e8eaed;
          --muted: #9aa0a6;
          --bg: #1f2023;
          --card: #2a2b2f;
          --line: #3c3d42;
          --accent: #8ab4f8;
          --accent-soft: #263248;
        }
      }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        margin: 0;
        padding: 20px 16px 24px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 4px 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .field + .field,
      .hint + .field,
      .field + .check,
      .check + .check,
      .check + .field {
        margin-top: 14px;
      }
      .field > .label {
        display: block;
        margin-bottom: 6px;
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .check input {
        margin: 3px 0 0;
        flex: none;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .check + .hint,
      .sub {
        margin-inline-start: 26px;
      }
      .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      [disabled],
      .off {
        opacity: 0.5;
      }
      select,
      input[type='time'],
      input[type='text'] {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
      }
      /* Длинный пункт «mail.360.yandex.ru — …» не должен растягивать страницу */
      select {
        max-width: 100%;
        min-width: 0;
      }
      /* Выбор из нескольких вариантов — карточки */
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choice {
        flex: 1 1 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
      }
      .choice:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .choice:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .choice input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .choice svg {
        color: var(--muted);
      }
      .choice:has(input:checked) svg {
        color: var(--accent);
      }
      .icons .choice {
        flex: 1 1 88px;
        padding: 10px 4px;
        font-size: 13px;
      }
      /* Цвет счётчика: образец значка и палитры */
      .colors {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
      }
      .preview {
        position: relative;
        width: 48px;
        height: 48px;
        flex: none;
      }
      .preview img {
        width: 40px;
        height: 40px;
      }
      /* Бейдж браузер рисует справа внизу при любом направлении текста */
      .preview span {
        position: absolute;
        right: 0;
        bottom: 2px;
        min-width: 14px;
        padding: 0 4px;
        border-radius: 8px;
        font: 600 12px/18px system-ui, sans-serif;
        text-align: center;
      }
      .palette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .palette + .palette {
        margin-top: 8px;
      }
      .palette > span {
        min-width: 4em;
        color: var(--muted);
        font-size: 13px;
      }
      .swatch {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
        background: none;
      }
      .swatch[aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Свой цвет: разноцветный кружок, внутри — стандартный выбор цвета браузера */
      .swatch.custom {
        position: relative;
        display: inline-block;
        box-sizing: border-box;
        background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      }
      .swatch.custom input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .swatch.custom:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .link {
        font: inherit;
        font-size: 13px;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        margin-top: 10px;
      }
      #accountList .sub {
        margin-inline-start: 0;
      }
      #accountList input[type='text'] {
        flex: 1 1 8em;
        min-width: 6em;
      }
      #accountList .hint {
        margin: 0;
        white-space: nowrap;
      }
      kbd {
        font: inherit;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 16px;
        color: var(--muted);
        font-size: 13px;
        margin-top: 16px;
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon48.png" width="32" height="32" alt="" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <section>
        <h2 data-i18n="optionsSectionCheck"></h2>
        <div class="field">
          <label class="label" for="mailHost" data-i18n="optionsMailHost"></label>
          <select id="mailHost"></select>
          <p class="hint" data-i18n="optionsMailHostHint"></p>
        </div>
        <div class="field">
          <label class="label" for="interval" data-i18n="menuInterval"></label>
          <select id="interval"></select>
        </div>
        <label class="check"><input type="checkbox" id="pauseWhenIdle" /> <span data-i18n="optionsPauseWhenIdle"></span></label>
        <p class="hint" data-i18n="optionsPauseWhenIdleHint"></p>
      </section>

      <section>
        <h2 data-i18n="optionsSectionOpen"></h2>
        <div class="choices" role="radiogroup">
          <label class="choice">
            <input type="radio" name="openIn" value="tab" />
            <svg width="56" height="40" viewBox="0 0 56 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="8" width="52" height="30" rx="3" />
              <path d="M2 14h52M6 8V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3" />
              <path d="M18 22h20l-10 7z" stroke-linejoin="round" />
            </svg>
            <span data-i18n="optionsOpenTab"></span>
          </label>
          <label class="choice">
            <input type="radio" name="openIn" value="window" />
            <svg width="56" height="40" viewBox="0 0 56 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="6" width="34" height="24" rx="3" opacity="0.4" />
              <rect x="18" y="12" width="36" height="26" rx="3" fill="var(--card)" />
              <path d="M18 18h36M26 25h20l-10 7z" stroke-linejoin="round" />
            </svg>
            <span data-i18n="optionsOpenWindow"></span>
          </label>
        </div>
        <p class="hint" data-i18n="optionsOpenHint"></p>
        <div class="field">
          <span data-i18n="optionsShortcut"></span> <kbd id="shortcut"></kbd>
          <p class="hint" data-i18n="optionsShortcutHint"></p>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionIcon"></h2>
        <div class="field">
          <span class="label" data-i18n="menuBadge"></span>
          <div class="choices" role="radiogroup" id="badgeModes"></div>
        </div>
        <div class="field">
          <span class="label" data-i18n="optionsIconStyle"></span>
          <div class="choices icons" role="radiogroup" id="iconStyles"></div>
        </div>
        <div class="field">
          <span class="label" data-i18n="optionsBadgeColor"></span>
          <div class="colors">
            <div class="preview" aria-hidden="true"><img id="previewIcon" alt="" /><span id="previewBadge">3</span></div>
            <div>
              <div class="palette" id="backgroundPalette"><span data-i18n="optionsBadgeBackground"></span></div>
              <div class="palette" id="textPalette"><span data-i18n="optionsBadgeText"></span></div>
              <button type="button" class="link" id="resetColors" data-i18n="optionsResetColors"></button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="menuNotifications"></h2>
        <label class="check"><input type="checkbox" id="notificationsEnabled" /> <span data-i18n="menuShowNotifications"></span></label>
        <label class="check" id="soundRow"><input type="checkbox" id="soundEnabled" /> <span data-i18n="menuSound"></span></label>
        <label class="check"><input type="checkbox" id="quietHoursEnabled" /> <span data-i18n="optionsQuietHours"></span></label>
        <div class="sub" id="quietTimes">
          <span data-i18n="optionsFrom"></span> <input type="time" id="quietFrom" required />
          <span data-i18n="optionsTo"></span> <input type="time" id="quietTo" required />
        </div>
      </section>

      <section id="accounts" hidden>
        <h2 data-i18n="optionsAccounts"></h2>
        <p class="hint" data-i18n="optionsAccountsHint"></p>
        <div id="accountList"></div>
      </section>

      <footer>
        <span id="version"></span>
        <a id="rate" target="_blank" rel="noopener">★ <span data-i18n="optionsRate"></span></a>
        <a id="report" target="_blank" rel="noopener" data-i18n="optionsReportBug"></a>
      </footer>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
