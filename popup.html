<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .status {
            text-align: center;
            margin-bottom: 10px;
        }
        .count {
            font-size: 24px;
            font-weight: bold;
            color: #d14836;
        }
        .button {
            background: #ffdb4d;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        .button:hover {
            background: #fc0;
        }
        .error {
            color: #ff6d00;
        }
    </style>
</head>
<body>
    <div class="status">
        <div>Непрочитанные письма:</div>
        <div id="count" class="count">...</div>
    </div>
    <button id="checkNow" class="button">Проверить сейчас</button>
    <button id="openMail" class="button">Открыть почту</button>
    
    <script src="popup.js"></script>
</body>
</html>
