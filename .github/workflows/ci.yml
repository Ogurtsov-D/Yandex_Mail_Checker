# Проверка каждого изменения: тесты, линтеры, сборка.
# Готовые архивы можно скачать на странице запуска (раздел Artifacts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Тесты
        run: npm test

      - name: Линтер и форматирование
        run: npm run lint

      - name: Сборка и проверка для Firefox
        run: npm run lint:firefox

      - uses: actions/upload-artifact@v7
        with:
          name: yandex-mail-checker
          path: dist/*.zip
