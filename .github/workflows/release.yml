# Релиз по тегу v<версия> (например, v1.5.0): проверки, сборка архивов для Chrome
# и Firefox, отправка Firefox-версии в каталог addons.mozilla.org и публикация на странице Releases.
#
# Тег можно отправить командой git push или создать при публикации релиза на GitHub —
# в обоих случаях срабатывает событие push тега, поэтому отдельный триггер release не нужен.
#
# Firefox-версия отправляется в каталог Mozilla: Mozilla проверяет её и публикует сама
# (от нескольких часов до нескольких дней), ждать этого релиз не должен. Для отправки нужны
# секреты репозитория AMO_JWT_ISSUER и AMO_JWT_SECRET (ключи API addons.mozilla.org,
# см. CONTRIBUTING.md). Если что-то не удалось, а релиз уже создан на GitHub,
# он переводится в черновик, чтобы посетители не увидели неполный релиз.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Повторные запуски для одного тега идут по очереди: Mozilla не принимает одну версию дважды
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Версия тега совпадает с manifest.json, ключи Mozilla заданы
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Тег v$TAG не совпадает с версией в manifest.json ($VERSION)"
            exit 1
          fi
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Не заданы секреты AMO_JWT_ISSUER и AMO_JWT_SECRET — без них нельзя отправить версию в каталог Mozilla (см. CONTRIBUTING.md)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Тесты и линтеры
        run: npm test && npm run lint && npm run lint:firefox

      - name: Отправка в каталог Mozilla (addons.mozilla.org)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # Проверку Mozilla не ждём (--approval-timeout 0): версия появится в каталоге после неё.
          # Данные для страницы в каталоге (краткое описание, категории, лицензия) — scripts/amo-metadata.json
          set +e
          npx --yes web-ext@10 sign --channel listed --source-dir dist/firefox \
            --amo-metadata scripts/amo-metadata.json --approval-timeout 0 \
            --artifacts-dir dist/signed 2>&1 | tee sign.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Повторный запуск или версия загружена вручную — Mozilla не принимает одну версию дважды
            if grep -qi "already exists" sign.log; then
              echo "::notice::Версия $VERSION уже отправлена в каталог Mozilla"
            else
              exit "$status"
            fi
          fi
          # Для тех, кто установил 1.4.x из файла .xpi: их Firefox по этому файлу перейдёт на версию из каталога
          node scripts/firefox-update-manifest.mjs "$VERSION" > dist/updates.json

      - name: Описание релиза из CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Публикация на странице Releases
        run: |
          FILES=(dist/*.zip dist/updates.json)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            # Релиз создан вручную без описания — подставляем его из CHANGELOG.md
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
            # Черновик после прошлого неудачного запуска — теперь всё на месте, публикуем
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Версия $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Неудача — скрыть неполный релиз
        if: failure()
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2> /dev/null)" = "false" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
            echo "::warning::Релиз $GITHUB_REF_NAME переведён в черновик. Что делать дальше — CONTRIBUTING.md, раздел «Если отправка не удалась»."
          fi
