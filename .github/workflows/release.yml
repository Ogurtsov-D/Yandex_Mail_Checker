# Релиз по тегу v<версия> (например, v1.4.1): проверки, сборка архивов для Chrome
# и Firefox, подпись Firefox-версии в Mozilla и публикация на странице Releases.
#
# Тег можно отправить командой git push или создать при публикации релиза на GitHub —
# в обоих случаях срабатывает событие push тега, поэтому отдельный триггер release не нужен.
#
# Релиз публикуется только целиком: с подписанным .xpi для Firefox. Для подписи нужны
# секреты репозитория AMO_JWT_ISSUER и AMO_JWT_SECRET (ключи API addons.mozilla.org,
# см. CONTRIBUTING.md). Если что-то не удалось, а релиз уже создан на GitHub,
# он переводится в черновик, чтобы посетители не увидели неполный релиз.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Повторные запуски для одного тега идут по очереди: Mozilla не принимает одну версию дважды
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Версия тега совпадает с manifest.json, ключи Mozilla заданы
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Тег v$TAG не совпадает с версией в manifest.json ($VERSION)"
            exit 1
          fi
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Не заданы секреты AMO_JWT_ISSUER и AMO_JWT_SECRET — без них нельзя подписать версию для Firefox (см. CONTRIBUTING.md)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Тесты и линтеры
        run: npm test && npm run lint && npm run lint:firefox

      - name: Подпись для Firefox (addons.mozilla.org, без публикации в каталоге)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          XPI="yandex-mail-checker-$VERSION-firefox.xpi"
          # .xpi уже приложен — повторный запуск или файл приложен вручную после ручной проверки в Mozilla
          if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2> /dev/null | grep -qx "$XPI"; then
            echo "Подписанный $XPI уже приложен к релизу — подпись не нужна"
          else
            npx --yes web-ext@10 sign --channel unlisted --source-dir dist/firefox \
              --artifacts-dir dist/signed --approval-timeout 900000
            mv dist/signed/*.xpi "dist/$XPI"
          fi
          node scripts/firefox-update-manifest.mjs "$VERSION" > dist/updates.json

      - name: Описание релиза из CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Публикация на странице Releases
        run: |
          # .xpi нет в dist/, если он уже приложен к релизу
          FILES=()
          for f in dist/*.zip dist/*.xpi dist/updates.json; do
            if [ -e "$f" ]; then FILES+=("$f"); fi
          done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            # Релиз создан вручную без описания — подставляем его из CHANGELOG.md
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
            # Черновик после прошлого неудачного запуска — теперь всё на месте, публикуем
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Версия $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Неудача — скрыть неполный релиз
        if: failure()
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2> /dev/null)" = "false" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
            echo "::warning::Релиз $GITHUB_REF_NAME переведён в черновик. Что делать дальше — CONTRIBUTING.md, раздел «Если подпись не удалась»."
          fi
