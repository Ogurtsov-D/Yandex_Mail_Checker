<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox (2 new) — Yandex Mail</title>
</head>
<body>
<div class="b-folders">
  <div class="b-folders__folder b-folders__folder_current">
    <span class="b-folders__folder__num">2</span>
    <a class="b-folders__folder__link" href="/lite/inbox">Inbox</a>
  </div>
</div>
<form class="b-messages" action="/lite/messages-action.xml" method="post">
  <div class="b-messages__message b-messages__message_unread">
    <input type="checkbox" name="ids" class="b-form-checkbox" value="1001">
    <a class="b-messages__from" href="/lite/compose?to=john%40example.com">John Smith</a>
    <a class="b-messages__message__link" href="/lite/message/1001"><span class="b-messages__subject">Hello</span></a>
  </div>
  <div class="b-messages__message b-messages__message_unread">
    <input type="checkbox" name="ids" class="b-form-checkbox" value="1002">
    <a class="b-messages__from" href="/lite/compose?to=jane%40example.com">Jane Doe</a>
    <a class="b-messages__message__link" href="/lite/message/1002"><span class="b-messages__subject">Meeting</span></a>
  </div>
</form>
</body>
</html>
